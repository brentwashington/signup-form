<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="flex-container">
        <div class="image-container">
            <img src="images/sauvage-cologne-bottle.jpg" alt="A bottle of sauvage cologne.">

            <!-- Image credit -->
            <p class="image-credit">
                Photo by <a
                    href="https://unsplash.com/@viewsbydre?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">DeAndre
                    Frasier</a> on <a
                    href="https://unsplash.com/photos/a-bottle-of-dior-sauvage-on-a-table-RZxzZFHVh94?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
                </a>
            </p>
        </div>
        <div class="signup-container">
            <div class="promo-text">
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize
                    your deepest dreams. Sign up <i>now</i> to get started.</p>
                <p>You <i>know</i> you want to.</p>
            </div>

            <p class="promo-text">Let's do this!</p>

            <form action="" method="get" class="signup-form">
                <div class="form-entry">
                    <label for="firstname">FIRST NAME</label>
                    <input type="text" id="firstname" name="firstname" required>
                </div>
                <div class="form-entry">
                    <label for="lastname">LAST NAME</label>
                    <input type="text" id="lastname" name="lastname" required>
                </div>
                <div class="form-entry">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-entry">
                    <label for="phone">PHONE NUMBER</label>
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                        placeholder="ex. 111-111-1111" required>
                </div>
                <div class="form-entry">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-entry">
                    <label for="confirmpassword">CONFIRM PASSWORD</label>
                    <input type="password" id="confirmpassword" name="confirmpassword" required>
                </div>
                <div>
                    <button type="submit">Create Account</button>
                </div>
            </form>

            <p class="login-prompt">Already have an account? <span>Log in</span></p>
        </div>

    </div>

</html>
